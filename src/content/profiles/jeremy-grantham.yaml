bio: >-
  ג'רמי גרנת'ם הוא משקיע בריטי, ממייסדי חברת ניהול ההשקעות GMO, שהוקמה בבוסטון
  ב-1977, והאסטרטג הראשי שלה להשקעות. הוא ידוע בזיהוי בועות: נמנע ממניות ומנדל"ן
  ביפן בסוף שנות ה-80 וממניות טכנולוגיה בבועת האינטרנט, וצמצם את החשיפה שלו לבועת
  הדיור. ב-2019 ייעד כ-98% מהונו, כמיליארד דולר, למאבק במשבר האקלים.
