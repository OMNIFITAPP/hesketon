bio: >-
  טוני רובינס הוא סופר, מאמן ונואם מוטיבציה אמריקאי, יליד צפון הוליווד (1960).
  בגיל 17 התחיל לעבוד אצל נואם המוטיבציה ג'ים רון, ובהמשך למד NLP (תכנות
  נוירו-לשוני) והתחיל להעביר סמינרים משלו לשיפור עצמי.
