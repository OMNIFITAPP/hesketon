bio: >-
  ג'פרסון פישר הוא עורך דין ליטיגציה, כותב ומרצה, שמטרתו לעזור לאנשים לתקשר טוב
  יותר בוויכוחים ובשיחות של היומיום. ספרו The Next Conversation, שיצא ב-2025,
  נכנס לרשימת רבי-המכר של הניו יורק טיימס ותורגם ל-40 שפות. הוא מגיש פודקאסט
  וניוזלטר עם עצות לשיחות הקשות, ומייסד משרד עורכי הדין Fisher Firm.
