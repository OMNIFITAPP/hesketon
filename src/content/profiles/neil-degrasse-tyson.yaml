bio: >-
  ניל דה-גראס טייסון הוא אסטרופיזיקאי אמריקאי, יליד ניו יורק (1958), בעל דוקטורט
  באסטרופיזיקה מאוניברסיטת קולומביה, ומאז 1996 מנהל הפלנטריום ע"ש היידן במוזיאון
  האמריקאי לתולדות הטבע. ב-2009 השיק את StarTalk, שהתחיל כתוכנית רדיו והתרחב
  לפודקאסט ולטלוויזיה, וב-2014 הגיש את Cosmos: A Spacetime Odyssey, ההמשך לסדרה
  של קרל סייגן.
