# Bio: English Wikipedia, "Graham Stephan" — born 1990 in Los Angeles; real
# estate investor, YouTuber and financial commentator; real estate licence in
# 2008, investing from 2011; the Oppenheim Group from 2015 until he left in
# 2020 to create content full time; YouTube since 2016, 5.16 million
# subscribers as of April 2026. Co-host of The Iced Coffee Hour with Jack
# Selby (Apple Podcasts listing: "Graham Stephan/Jack Selby").
# On הסכתון he appears only as a host. Books: none.
# Links: @GrahamStephan ("Graham Stephan - YouTube"); the podcast on Apple.
bio: >-
  גרהם סטפן הוא משקיע נדל"ן, יוטיובר ופרשן פיננסי, יליד לוס אנג'לס (1990). הוא
  קיבל רישיון תיווך ב-2008, התחיל להשקיע ב-2011 ועבד בקבוצת Oppenheim מ-2015, עד
  שעזב ב-2020 כדי ליצור תוכן במשרה מלאה. ערוץ היוטיוב שלו, שנפתח ב-2016, מונה
  יותר מחמישה מיליון מנויים, ויחד עם ג'ק סלבי הוא מנחה את הפודקאסט The Iced
  Coffee Hour.
