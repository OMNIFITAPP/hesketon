bio: >-
  הנרי שוקמן הוא מורה זן אנגלי, יליד אוקספורד (1962), מאסטר זן מוסמך בשושלת
  Sanbo Zen, ששימש מנהל רוחני של מרכז הזן Mountain Cloud בסנטה פה. לפני שהתמסר
  להוראה היה משורר, סופר וכותב מסעות, וזכה בכמה פרסים ספרותיים. הוא ממייסדי
  אפליקציית המדיטציה The Way והמורה הראשי בה.
