bio: >-
  מאחורי MrBeast עומד ג'ימי (ג'יימס סטיבן) דונלדסון, יוצר תוכן אמריקאי, יליד
  וויצ'יטה, קנזס (1998), שהתחיל להעלות סרטונים ליוטיוב ב-2012. הוא ידוע בסרטוני
  אתגרים ותרומות עם פרסים כספיים גדולים, והערוץ שלו הוא הערוץ עם הכי הרבה מנויים
  ביוטיוב: 518 מיליון בספטמבר 2026. ב-2024 השיק ב-Amazon Prime Video את תחרות
  הריאליטי Beast Games, עם 1,000 מתמודדים ופרס של 5 מיליון דולר, והוא עומד מאחורי
  מותג החטיפים Feastables.
