bio: >-
  אנני ג'ייקובסן היא עיתונאית תחקירים וסופרת אמריקאית שכותבת על מערכות הביטחון
  והמודיעין של ארצות הברית. בין ספריה Area 51 ו-Operation Paperclip, וב-2016 הייתה
  בין המועמדים הסופיים לפרס פוליצר להיסטוריה על The Pentagon's Brain. היא גם כתבה
  פרקים לסדרה Jack Ryan של אמזון.
