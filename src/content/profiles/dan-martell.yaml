bio: >-
  דן מרטל הוא יזם, משקיע ומאמן של מייסדי חברות תוכנה. בתוך עשור הקים, הצמיח
  ומכר שלוש חברות טכנולוגיה, וב-2012 נבחר למשקיע האנג'ל המוביל בקנדה אחרי
  שהשקיע ביותר מ-50 סטארט-אפים. ב-2016 ייסד את SaaS Academy, שהפכה לאחת מחברות
  האימון הגדולות בעולם, וספרו Buy Back Your Time, שיצא ב-2023, נכנס לרשימת
  רבי-המכר של וול סטריט ג'ורנל.
